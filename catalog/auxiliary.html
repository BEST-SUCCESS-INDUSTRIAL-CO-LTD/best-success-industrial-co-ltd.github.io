<script>
(function(){
var figs=[].slice.call(document.querySelectorAll('.pg')),T=figs.length,cnt=document.getElementById('cnt'),prog=document.getElementById('prog');
var cur=0,done=0,active=0,MAX=4,state=figs.map(function(){return 0});
function load(i){var img=figs[i].querySelector('img');state[i]=1;active++;
  img.onload=img.onerror=function(){img.classList.add('ok');state[i]=2;active--;done++;prog.style.width=(done/T*100)+'%';if(done===T)prog.style.opacity=0;pump();};
  img.srcset=img.dataset.srcset;img.src=img.dataset.src;}
function next(){ /* nearest unloaded page to the current position, looking ahead first */
  for(var d=0;d<T;d++){var a=cur+d,b=cur-d;if(a<T&&!state[a])return a;if(b>=0&&!state[b]&&d<3)return b;}
  for(var k=0;k<T;k++)if(!state[k])return k;return -1;}
function pump(){while(active<MAX){var i=next();if(i<0)return;load(i);}}
if('IntersectionObserver' in window){
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){var n=+e.target.dataset.n;cnt.textContent='第 '+n+' / '+T+' 頁';cur=n-1;pump();}});},{rootMargin:'-45% 0px -50% 0px'});
  figs.forEach(function(f){io.observe(f);});
}
pump();
})();
</script>
